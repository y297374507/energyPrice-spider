<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大宗能源价格高频监测看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- 顶部标题栏 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                    <span>🔥</span> 大宗能源价格走势看板
                </h1>
                <p class="text-sm text-gray-500 mt-1">数据源：上海石油天然气交易中心 (SHPGX) | 中国煤炭市场网 (CCTD)</p>
            </div>
            <div class="bg-blue-50 px-4 py-2 rounded-xl text-right">
                <span class="text-xs text-blue-500 block font-medium">最后自动抓取时间</span>
                <span id="last-update" class="text-sm font-semibold text-blue-700">加载中...</span>
            </div>
        </div>

        <!-- 实时价格卡片网格 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <span class="text-xs text-gray-400 font-medium">中国 LNG 出厂价 (全国)</span>
                <div id="lng-price" class="text-2xl font-black text-blue-600 mt-1">-- 元/吨</div>
                <span id="lng-date" class="text-xs text-gray-400 mt-1 block">发布日期: --</span>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <span class="text-xs text-gray-400 font-medium">CCTD 秦皇岛动力煤 (Q5500)</span>
                <div id="coal-price" class="text-2xl font-black text-amber-600 mt-1">-- 元/吨</div>
                <span id="coal-date" class="text-xs text-gray-400 mt-1 block">发布日期: --</span>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <span class="text-xs text-gray-400 font-medium">中国汽柴油批发价 (柴 / 汽)</span>
                <div id="oil-price" class="text-xl font-bold text-emerald-600 mt-1.5">-- / -- 元/吨</div>
                <span id="oil-date" class="text-xs text-gray-400 mt-1 block">发布日期: --</span>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 图表 1: 动力煤 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-gray-800 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                        CCTD 秦皇岛动力煤价格走势 (Q5500大卡)
                    </h2>
                    <span class="text-xs bg-amber-50 text-amber-600 px-2 py-1 rounded">接口内置历史</span>
                </div>
                <div class="relative h-72">
                    <div id="coalChart" class="w-full h-full"></div>
                </div>
            </div>

            <!-- 图表 2: LNG -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-gray-800 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                        全国 LNG 出厂价格跟踪
                    </h2>
                    <span id="lng-status-tag" class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded">积累中 (1 天)</span>
                </div>
                <div class="relative h-72">
                    <div id="lngChart" class="w-full h-full"></div>
                </div>
            </div>

            <!-- 图表 3: 汽柴油 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 md:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-gray-800 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        全国汽柴油批发价格走势对比 (元/吨)
                    </h2>
                    <span id="oil-status-tag" class="text-xs bg-emerald-50 text-emerald-600 px-2 py-1 rounded">高频监测</span>
                </div>
                <div class="relative h-64">
                    <div id="oilChart" class="w-full h-full"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 通用配置：纯折线 + 虚线十字准星（无面积阴影）
        function getBaseOption(unit = '元/吨') {
            return {
                grid: { left: 55, right: 20, top: 30, bottom: 35 },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross',
                        crossStyle: { color: '#94a3b8' },
                        lineStyle: { type: 'dashed', color: '#94a3b8', width: 1 }
                    },
                    backgroundColor: 'rgba(255,255,255,0.96)',
                    borderColor: '#e2e8f0',
                    borderWidth: 1,
                    textStyle: { color: '#334155', fontSize: 12 },
                    formatter: function (params) {
                        if (!params || params.length === 0) return '';
                        let html = `<div style="font-weight:600;margin-bottom:4px">${params[0].axisValueLabel}</div>`;
                        params.forEach(p => {
                            if (p.value == null || p.value === undefined) return;
                            html += `<div style="display:flex;align-items:center;gap:6px;margin:2px 0">
                                <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${p.color}"></span>
                                ${p.seriesName}: <b>${p.value}</b> ${unit}
                            </div>`;
                        });
                        return html;
                    }
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    axisLine: { lineStyle: { color: '#cbd5e1' } },
                    axisLabel: { color: '#64748b', fontSize: 11 },
                    axisTick: { show: false }
                },
                yAxis: {
                    type: 'value',
                    scale: true,
                    name: unit,
                    nameTextStyle: { color: '#94a3b8', fontSize: 10 },
                    axisLine: { show: false },
                    splitLine: { lineStyle: { color: '#e2e8f0' } },
                    axisLabel: { color: '#64748b', fontSize: 11 }
                }
            };
        }

        async function renderDashboard() {
            try {
                const response = await fetch('./data.json');
                if (!response.ok) throw new Error("无法读取 data.json");
                const history = await response.json();

                if (!history || history.length === 0) return;

                // 1. 最后更新时间
                const latestRecord = history[history.length - 1];
                document.getElementById('last-update').innerText = latestRecord.timestamp;

                const items = latestRecord.items;

                // ==================== 2. 顶栏卡片 ====================
                const lngObj = items['中国LNG出厂价格（全国）'];
                if (lngObj && lngObj.BASEPRICE) {
                    document.getElementById('lng-price').innerText = `${lngObj.BASEPRICE} 元/吨`;
                    document.getElementById('lng-date').innerText = `发布日期: ${lngObj.DATA || '最新'}`;
                }

                const oilObj = items['中国汽柴油批发价格'];
                if (oilObj && oilObj.BASEPRICE_diesel) {
                    document.getElementById('oil-price').innerText = `${oilObj.BASEPRICE_diesel} / ${oilObj.BASEPRICE_petrol}`;
                    document.getElementById('oil-date').innerText = `发布日期: ${oilObj.DATA_diesel || '最新'}`;
                }

                const coalObj = items['CCTD秦皇岛动力煤价格'];
                let coalDates = [], coalPrices = [];
                if (coalObj && Array.isArray(coalObj.data) && coalObj.data.length > 0) {
                    const latestCoal = coalObj.data[0];
                    document.getElementById('coal-price').innerText = `${latestCoal[1]} 元/吨`;
                    document.getElementById('coal-date').innerText = `发布日期: ${latestCoal[0]}`;

                    const reversedData = [...coalObj.data].reverse();
                    coalDates = reversedData.map(row => row[0]);
                    coalPrices = reversedData.map(row => parseFloat(row[1]));
                }

                // ==================== 3. 动力煤图表（无面积） ====================
                if (coalPrices.length > 0) {
                    const coalChart = echarts.init(document.getElementById('coalChart'));
                    const option = getBaseOption('元/吨');
                    option.series = [{
                        name: '5500大卡动力煤',
                        type: 'line',
                        data: coalPrices,
                        smooth: 0.3,
                        symbol: 'circle',
                        symbolSize: 6,
                        showSymbol: true,
                        lineStyle: { color: '#f59e0b', width: 2 },
                        itemStyle: { color: '#f59e0b' }
                        // 已去掉 areaStyle，不再有阴影
                    }];
                    option.xAxis.data = coalDates;
                    coalChart.setOption(option);
                    window.addEventListener('resize', () => coalChart.resize());
                }

                // ==================== 4. 提取历史数据 ====================
                let historyDates = [];
                let lngPrices = [];
                let dieselPrices = [];
                let petrolPrices = [];

                history.forEach(snapshot => {
                    const timeLabel = snapshot.timestamp.split(' ')[0];
                    if (!historyDates.includes(timeLabel)) {
                        historyDates.push(timeLabel);

                        const curLNG = snapshot.items['中国LNG出厂价格（全国）'];
                        // 强制转数字，无效值用 null
                        const lngVal = curLNG && curLNG.BASEPRICE != null ? parseFloat(curLNG.BASEPRICE) : null;
                        lngPrices.push(isNaN(lngVal) ? null : lngVal);

                        const curOil = snapshot.items['中国汽柴油批发价格'];
                        const dieselVal = curOil && curOil.BASEPRICE_diesel != null ? parseFloat(curOil.BASEPRICE_diesel) : null;
                        const petrolVal = curOil && curOil.BASEPRICE_petrol != null ? parseFloat(curOil.BASEPRICE_petrol) : null;
                        dieselPrices.push(isNaN(dieselVal) ? null : dieselVal);
                        petrolPrices.push(isNaN(petrolVal) ? null : petrolVal);
                    }
                });

                document.getElementById('lng-status-tag').innerText = `连续监测 (${historyDates.length} 天)`;

                // ==================== 5. LNG 图表（重点修复） ====================
                const lngChart = echarts.init(document.getElementById('lngChart'));
                {
                    const option = getBaseOption('元/吨');
                    option.series = [{
                        name: 'LNG 出厂价',
                        type: 'line',
                        data: lngPrices,
                        smooth: 0.2,
                        symbol: 'circle',
                        symbolSize: 8,          // 单点时更明显
                        showSymbol: true,      // 始终显示数据点
                        connectNulls: true,    // 连接空值，避免断线
                        lineStyle: { color: '#3b82f6', width: 2 },
                        itemStyle: { color: '#3b82f6' }
                        // 已去掉 areaStyle
                    }];
                    option.xAxis.data = historyDates;
                    lngChart.setOption(option);
                    window.addEventListener('resize', () => lngChart.resize());
                }

                // ==================== 6. 汽柴油图表 ====================
                const oilChart = echarts.init(document.getElementById('oilChart'));
                {
                    const option = getBaseOption('元/吨');
                    option.legend = {
                        data: ['92# 汽油批发价', '0# 柴油批发价'],
                        top: 5,
                        textStyle: { color: '#64748b', fontSize: 11 }
                    };
                    option.grid.top = 40;
                    option.series = [
                        {
                            name: '92# 汽油批发价',
                            type: 'line',
                            data: petrolPrices,
                            smooth: 0.2,
                            symbol: 'circle',
                            symbolSize: 6,
                            showSymbol: true,
                            connectNulls: true,
                            lineStyle: { color: '#ef4444', width: 2 },
                            itemStyle: { color: '#ef4444' }
                        },
                        {
                            name: '0# 柴油批发价',
                            type: 'line',
                            data: dieselPrices,
                            smooth: 0.2,
                            symbol: 'circle',
                            symbolSize: 6,
                            showSymbol: true,
                            connectNulls: true,
                            lineStyle: { color: '#10b981', width: 2 },
                            itemStyle: { color: '#10b981' }
                        }
                    ];
                    option.xAxis.data = historyDates;
                    oilChart.setOption(option);
                    window.addEventListener('resize', () => oilChart.resize());
                }

            } catch (err) {
                console.error("解析数据失败：", err);
                document.getElementById('last-update').innerText = "数据读取异常";
            }
        }

        renderDashboard();
    </script>
</body>
</html>
