<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大宗能源价格高频监测看板</title>
    <!-- Tailwind CSS 与 Chart.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- 顶部标题栏 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                    <span>🔥</span> 大宗能源价格走势看板
                </h1>
                <p class="text-sm text-gray-500 mt-1">数据源：上海石油天然气交易中心 (SHPGX) | 中国煤炭市场网 (CCTD)</p>
            </div>
            <div class="bg-blue-50 px-4 py-2 rounded-xl text-right">
                <span class="text-xs text-blue-500 block font-medium">最后抓取时间</span>
                <span id="last-update" class="text-sm font-semibold text-blue-700">加载中...</span>
            </div>
        </div>

        <!-- 核心图表区域 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 图表 1: 全国 LNG 出厂价格 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-gray-800 flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                        中国 LNG 出厂价格 (全国)
                    </h2>
                    <span id="lng-latest" class="text-lg font-extrabold text-blue-600">-- 元/吨</span>
                </div>
                <div class="relative h-64">
                    <canvas id="lngChart"></canvas>
                </div>
            </div>

            <!-- 图表 2: CCTD 动力煤价格 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-gray-800 flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                        CCTD 秦皇岛动力煤价格
                    </h2>
                    <span id="coal-latest" class="text-lg font-extrabold text-amber-600">-- 元/吨</span>
                </div>
                <div class="relative h-64">
                    <canvas id="coalChart"></canvas>
                </div>
            </div>

        </div>

        <!-- JSON 结构诊断面板（解决提取不到数值的核心） -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-base font-bold text-gray-800 mb-2">🔍 原始数据采样调试 (用于排查结构)</h2>
            <p class="text-xs text-gray-400 mb-3">如果上方价格仍显示 --，请参考以下 JSON 节点字段：</p>
            <pre id="debug-json" class="bg-gray-900 text-green-400 p-4 rounded-xl text-xs overflow-x-auto max-h-48 font-mono"></pre>
        </div>

    </div>

    <script>
        // 智能递归解析函数：深度搜寻 JSON 对象里的日期和数值
        function extractPrices(obj) {
            let points = [];

            function traverse(o) {
                if (!o) return;

                if (Array.isArray(o)) {
                    o.forEach(item => traverse(item));
                } else if (typeof o === 'object') {
                    // 尝试匹配常见日期和价格属性名
                    let date = o.rq || o.date || o.END_DATE || o.time || o.create_time || o.publish_time || o.dt;
                    let price = o.price || o.index_price || o.PRICE || o.value || o.zs || o.val || o.number;

                    // 转换数字
                    if (price !== undefined && price !== null) {
                        let parsedPrice = parseFloat(price);
                        if (!isNaN(parsedPrice) && parsedPrice > 0) {
                            points.push({
                                date: date ? String(date).split(' ')[0] : '常规快照',
                                price: parsedPrice
                            });
                        }
                    }

                    // 深入子节点查找
                    for (let key in o) {
                        if (typeof o[key] === 'object') {
                            traverse(o[key]);
                        }
                    }
                }
            }

            traverse(obj);
            
            // 去重并截取最后 30 条数据
            let uniqueMap = new Map();
            points.forEach(p => uniqueMap.set(p.date + '_' + p.price, p));
            return Array.from(uniqueMap.values()).slice(-30);
        }

        async function initDashboard() {
            try {
                const response = await fetch('./data.json');
                if (!response.ok) throw new Error("读取 data.json 失败");
                const history = await response.json();

                if (!history || history.length === 0) return;

                const latestRecord = history[history.length - 1];
                document.getElementById('last-update').innerText = latestRecord.timestamp;

                // 显示最新拿到的 JSON 数据结构以供观察
                document.getElementById('debug-json').innerText = JSON.stringify(latestRecord, null, 2).slice(0, 1500) + "\n...";

                // 深度提取 LNG 和 动力煤 数据
                const lngRaw = latestRecord.items['中国LNG出厂价格（全国）'];
                const coalRaw = latestRecord.items['CCTD秦皇岛动力煤价格'];

                const lngSeries = extractPrices(lngRaw);
                const coalSeries = extractPrices(coalRaw);

                // 更新最新数值
                if (lngSeries.length > 0) {
                    const latestLNG = lngSeries[lngSeries.length - 1].price;
                    document.getElementById('lng-latest').innerText = `${latestLNG} 元/吨`;
                }

                if (coalSeries.length > 0) {
                    const latestCoal = coalSeries[coalSeries.length - 1].price;
                    document.getElementById('coal-latest').innerText = `${latestCoal} 元/吨`;
                }

                // 绘制 LNG 折线图
                if (lngSeries.length > 0) {
                    new Chart(document.getElementById('lngChart'), {
                        type: 'line',
                        data: {
                            labels: lngSeries.map(s => s.date),
                            datasets: [{
                                label: 'LNG 出厂价 (元/吨)',
                                data: lngSeries.map(s => s.price),
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false }
                    });
                }

                // 绘制 动力煤 折线图
                if (coalSeries.length > 0) {
                    new Chart(document.getElementById('coalChart'), {
                        type: 'line',
                        data: {
                            labels: coalSeries.map(s => s.date),
                            datasets: [{
                                label: '动力煤价格 (元/吨)',
                                data: coalSeries.map(s => s.price),
                                borderColor: '#f59e0b',
                                backgroundColor: 'rgba(245, 158, 11, 0.1)',
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false }
                    });
                }

            } catch (err) {
                console.error(err);
                document.getElementById('last-update').innerText = "数据读取失败";
            }
        }

        initDashboard();
    </script>
</body>
</html>
