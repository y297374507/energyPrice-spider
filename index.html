<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大宗能源价格高频监测看板</title>

    <!-- 引入 Tailwind CSS (样式) 与 Chart.js (绘图) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- 顶部标题栏 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                    <span>🔥</span> 大宗能源价格走势看板
                </h1>
                <p class="text-sm text-gray-500 mt-1">数据源：上海石油天然气交易中心 (SHPGX) | 中国煤炭市场网 (CCTD)</p>
            </div>
            <div class="bg-blue-50 px-4 py-2 rounded-xl text-right">
                <span class="text-xs text-blue-500 block font-medium">最后自动抓取时间</span>
                <span id="last-update" class="text-sm font-semibold text-blue-700">加载中...</span>
            </div>
        </div>

        <!-- 核心图表区域 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 图表 1: 全国 LNG 出厂价格 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-gray-800 flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                        中国 LNG 出厂价格 (全国)
                    </h2>
                    <span id="lng-latest" class="text-lg font-extrabold text-blue-600">-- 元/吨</span>
                </div>
                <div class="relative h-64">
                    <canvas id="lngChart"></canvas>
                </div>
            </div>

            <!-- 图表 2: CCTD 动力煤价格 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-gray-800 flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                        CCTD 秦皇岛动力煤价格
                    </h2>
                    <span id="coal-latest" class="text-lg font-extrabold text-amber-600">-- 元/吨</span>
                </div>
                <div class="relative h-64">
                    <canvas id="coalChart"></canvas>
                </div>
            </div>

        </div>

        <!-- 数据采集日志表 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-base font-bold text-gray-800 mb-4">最近 10 次抓取快照状态</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-gray-500 text-xs rounded-lg">
                        <tr>
                            <th class="py-3 px-4">抓取时间</th>
                            <th class="py-3 px-4">LNG 接口</th>
                            <th class="py-3 px-4">汽柴油接口</th>
                            <th class="py-3 px-4">动力煤接口</th>
                        </tr>
                    </thead>
                    <tbody id="log-table" class="divide-y divide-gray-100">
                        <!-- 由 JS 动态注入 -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // 通用数据解析助手：自动适应不同的接口返回格式
        function parseSeriesData(itemData) {
            if (!itemData) return [];
            
            let result = [];
            // 如果返回的是 List 格式
            if (Array.isArray(itemData)) {
                result = itemData;
            } else if (itemData.data && Array.isArray(itemData.data)) {
                result = itemData.data;
            } else if (itemData.list && Array.isArray(itemData.list)) {
                result = itemData.list;
            }

            // 提取 日期 和 价格
            return result.map(entry => {
                const date = entry.END_DATE || entry.date || entry.time || entry.rq || '未知';
                const price = parseFloat(entry.PRICE || entry.price || entry.value || entry.zs || 0);
                return { date, price };
            }).filter(item => item.price > 0);
        }

        async function initDashboard() {
            try {
                const response = await fetch('./data.json');
                if (!response.ok) throw new Error("读取 data.json 失败");
                const history = await response.json();

                if (!history || history.length === 0) return;

                // 1. 设置顶部最新时间
                const latestRecord = history[history.length - 1];
                document.getElementById('last-update').innerText = latestRecord.timestamp;

                // 2. 提取最近一次抓取的 JSON 包内含的具体价格列表
                const lngRaw = latestRecord.items['中国LNG出厂价格（全国）'];
                const coalRaw = latestRecord.items['CCTD秦皇岛动力煤价格'];

                const lngSeries = parseSeriesData(lngRaw);
                const coalSeries = parseSeriesData(coalRaw);

                // 更新最新价格标签
                if (lngSeries.length > 0) {
                    document.getElementById('lng-latest').innerText = `${lngSeries[lngSeries.length - 1].price} 元/吨`;
                }
                if (coalSeries.length > 0) {
                    document.getElementById('coal-latest').innerText = `${coalSeries[coalSeries.length - 1].price} 元/吨`;
                }

                // 3. 绘制 LNG 价格折线图
                new Chart(document.getElementById('lngChart'), {
                    type: 'line',
                    data: {
                        labels: lngSeries.map(s => s.date),
                        datasets: [{
                            label: 'LNG 出厂价 (元/吨)',
                            data: lngSeries.map(s => s.price),
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true,
                            tension: 0.3,
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { grid: { display: false } } }
                    }
                });

                // 4. 绘制 CCTD 动力煤价格折线图
                new Chart(document.getElementById('coalChart'), {
                    type: 'line',
                    data: {
                        labels: coalSeries.map(s => s.date),
                        datasets: [{
                            label: '动力煤价格 (元/吨)',
                            data: coalSeries.map(s => s.price),
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            fill: true,
                            tension: 0.3,
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { grid: { display: false } } }
                    }
                });

                // 5. 填充底部的日志表
                const logTable = document.getElementById('log-table');
                [...history].reverse().slice(0, 10).forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="py-2.5 px-4 font-mono text-xs">${row.timestamp}</td>
                        <td class="py-2.5 px-4">${row.items['中国LNG出厂价格（全国）'] ? '🟢 正常获取' : '🔴 失败'}</td>
                        <td class="py-2.5 px-4">${row.items['中国汽柴油批发价格'] ? '🟢 正常获取' : '🔴 失败'}</td>
                        <td class="py-2.5 px-4">${row.items['CCTD秦皇岛动力煤价格'] ? '🟢 正常获取' : '🔴 失败'}</td>
                    `;
                    logTable.appendChild(tr);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('last-update').innerText = "读取数据失败";
            }
        }

        initDashboard();
    </script>
</body>
</html>
